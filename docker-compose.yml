version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    
    depends_on:
      - backend

    networks:
      - mynetwork

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    
    depends_on:
      - db

    networks:
      - mynetwork
  
  db:
    image: mariadb:latest
    environment:
      - MARIADB_ROOT_PASSWORD=root

    volumes:
      - dbdata:/var/lib/mysql

    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  dbdata:

  